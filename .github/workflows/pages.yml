# Trang giới thiệu + web-app Ngôi Sao A+ trên GitHub Pages.
# Tự chạy khi đổi site/ hoặc mobile/www/. Kết quả: https://<tài khoản>.github.io/<kho>/  (web-app ở /app/)
name: Trang web – GitHub Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'mobile/www/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Ghép trang giới thiệu và web-app
        run: |
          mkdir -p _site/app
          cp -r site/. _site/
          cp -r mobile/www/. _site/app/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
