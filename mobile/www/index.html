<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D71E28">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Luyện Toán, Tiếng Anh và Tư duy cho học sinh mầm non đến lớp 9 — bài tập sinh tự động, lời giải từng bước, Góc phụ huynh theo dõi tiến bộ.">
<title>Ngôi Sao A+</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ngôi Sao A+">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>
<script src="capacitor.js"></script>
<script src="native.js"></script>
<script src="ai-config.js"></script>
<script src="video-config.js"></script>
<script src="store-config.js"></script>
<script src="app.js"></script>
<script>
  (function () {
    var nat = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
    if (!nat && 'serviceWorker' in navigator && location.protocol === 'https:' && window.top === window) {
      // có bản mới: bộ nhớ đệm mới vừa nhận quyền → tải lại ngay khi đang ở trang chủ, hoặc lần sau con về trang chủ (không cắt ngang bài đang làm)
      var hadCtrl = !!navigator.serviceWorker.controller, fresh = false;
      var home = function () { var s = window.HV && HV.UI && HV.UI.S && HV.UI.S.screen; return !s || ['welcome', 'picker', 'home', 'loading'].indexOf(s) >= 0; };
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadCtrl || fresh) return;
        fresh = true;
        if (home()) { location.reload(); return; }
        var t = setInterval(function () { if (home()) { clearInterval(t); location.reload(); } }, 1500);
      });
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').then(function (r) { try { r.update(); } catch (e) { /* bỏ qua */ } }).catch(function () {}); });
    }
  })();
</script>
</body>
</html>
